  }

  function getEdgePow() {

  function draw() {

    var w = window.innerWidth;
    var h = window.innerHeight;
    var isDark = document.documentElement.classList.contains("dark");
    var time = now * 0.0003;
    var bgColor = isDark ? "#0a0a0a" : "#ffffff";

    var sunset = window.__sunsetMode ? 1 : 0;

    var baseY = getBaseY();
    updateRowCount(baseY);
    var rowSpacing = baseY / joyRows;
