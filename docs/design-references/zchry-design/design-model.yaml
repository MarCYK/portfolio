name: "Zchry"
philosophy: "Quiet instrument-panel minimalism: monochrome field, precise lines, sparse red signals. Editorial restraint in typography and spacing, but with a living waveform stage that makes the interface feel authored, not templated."
primary_mode: "dark"
brand_domain: "personal portfolio / design-engineering showcase"
brand_type: "ui-rich"
mono_for_code: true
mono_for_metrics: false

primitives:
  colors:
    neutral:
      50: "#FAFAFA"
      100: "#F5F5F5"
      200: "#EEEEEE"
      300: "#E5E5E5"
      400: "#A3A3A3"
      500: "#737373"
      600: "#525252"
      700: "#3D3D3D"
      800: "#2A2A2A"
      900: "#111111"
      950: "#0A0A0A"
    brand:
      50: "#FFE3E3"
      100: "#FFC7C7"
      200: "#FF9B9B"
      300: "#FF8181"
      400: "#FF5A5A"
      500: "#FF0000"
      600: "#E60000"
      700: "#BF0000"
      800: "#990000"
      900: "#7A0000"
      950: "#3D0000"
    red: { 50: "#FEE2E2", 500: "#EF4444", 900: "#7F1D1D" }
    green: { 50: "#DCFCE7", 500: "#22C55E", 900: "#14532D" }
    amber: { 50: "#FEF9C3", 500: "#EAB308", 900: "#78350F" }
  spacing: [0, 2, 4, 8, 12, 16, 20, 24, 32, 40, 48, 64, 80, 96]
  radii: [0, 4, 8, 12, 999]

tokens:
  colors:
    light:
      background: "{neutral.50}"
      surface1: "{neutral.50}"
      surface2: "{neutral.100}"
      surface3: "{neutral.200}"
      border: "{neutral.300}"
      border_visible: "{neutral.400}"
      text1: "{neutral.950}"
      text2: "{neutral.600}"
      text3: "{neutral.500}"
      text4: "{neutral.400}"
      accent: "{brand.500}"
      accent_subtle: "{brand.50}"
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      surface3: "{neutral.700}"
      border: "{neutral.800}"
      border_visible: "{neutral.700}"
      text1: "{neutral.50}"
      text2: "{neutral.400}"
      text3: "{neutral.600}"
      text4: "{neutral.500}"
      accent: "{brand.500}"
      accent_subtle: "{brand.950}"
    success: "{green.500}"
    warning: "{amber.500}"
    error: "{red.500}"

  spacing:
    2xs: 2
    xs: 4
    sm: 8
    md: 16
    lg: 24
    xl: 32
    2xl: 48
    3xl: 64
    4xl: 96

  radii:
    element: 4
    control: 8
    component: 12
    container: 12
    pill: 999

  typography:
    display: { family: "Soehne", size: "30px", weight: 600, line_height: 1.2, letter_spacing: "-0.025em" }
    heading: { family: "Soehne", size: "24px", weight: 600, line_height: 1.33, letter_spacing: "-0.02em" }
    subheading: { family: "Soehne", size: "18px", weight: 600, line_height: 1.56, letter_spacing: "-0.015em" }
    body: { family: "Soehne", size: "16px", weight: 400, line_height: 1.5, letter_spacing: "0" }
    body_sm: { family: "Soehne", size: "14px", weight: 400, line_height: 1.43, letter_spacing: "0" }
    caption: { family: "Soehne", size: "12px", weight: 400, line_height: 1.33, letter_spacing: "0" }
    label: { family: "Soehne", size: "12px", weight: 600, line_height: 1.5, letter_spacing: "0.05em", transform: "uppercase" }
    mono: { family: "IBM Plex Mono", size: "12px", weight: 400, line_height: 1.33 }

  elevation:
    strategy: "flat"
    level1_light: "none"
    level1_dark: "none"
    level2_light: "none"
    level2_dark: "none"
    level3_light: "none"
    level3_dark: "none"

  motion:
    personality: "mechanical"
    easing: "cubic-bezier(.4,0,.2,1)"
    duration_fast: "150ms"
    duration_normal: "200ms"

  hero_stage:
    preset: "sculptural-field"
    observed_style:
      description: "Animated stacked Joy Division waveform field; monochrome lines on black. The field is the hero; no foreground object."
      where_used: ["home hero"]
    background:
      medium: "sculptural"
      color_mode: "monochrome"
      saturation: "flat"
      light_source: "center"
      falloff: "soft"
      vignette: "subtle"
      texture: "clean"
      motion: "reactive"
      intensity: "subtle"
      safe_zone: "full-bleed"
      color_palette: ["#0A0A0A", "#111111", "#2A2A2A", "#FAFAFA"]
    hero:
      subject: "none"
    relation:
      type: "flat"
      bleed: 0
    disclaimer: "Waveform stage approximated with layered SVG/CSS curves. Original production animation is custom canvas code."

  iconography:
    observed_style:
      description: "Thin outline utility glyphs (~1.5px), soft corners, geometric/humanist blend, minimal detail."
      stroke_weight: "regular"
      corner_treatment: "soft"
      fill_style: "outline"
      form_language: "geometric"
      visual_density: "minimal"
    fallback_kit:
      name: "Tabler"
      weight: "outline"
      match_score: "high"
      match_reasoning: "Tabler's 1.5px outline stroke and restrained geometric forms are closest to the observed utility icon rhythm. Lucide is close but reads slightly rounder and lighter in this context."
      cdn: "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.41.1/dist/tabler-icons.min.css"
      icon_class_prefix: "ti ti-"
    disclaimer: "Generated previews use a best-match fallback icon kit. Original site icons are proprietary/custom."

components:
  button_primary:
    source: "derived"
    background: "{brand.500}"
    color: "#FFFFFF"
    padding: "10px 16px"
    radius: "{radii.control}"
    font_weight: 600
    hover: { background: "{brand.600}" }
  button_secondary:
    source: "derived"
    background: "transparent"
    color: "{neutral.50}"
    border: "1px solid {neutral.700}"
  card:
    source: "observed"
    background: "{neutral.900}"
    border: "1px solid {neutral.800}"
    radius: "{radii.component}"
    padding: "40px"
  input:
    source: "derived"
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: "{radii.control}"
    padding: "10px 12px"
  list_row:
    source: "observed"
    border_bottom: "1px solid {neutral.800}"
    padding: "20px 0"
  tag:
    source: "derived"
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: "{radii.pill}"
  modal:
    source: "derived"
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: "{radii.container}"
  toggle:
    source: "derived"
    track_bg: "{neutral.800}"
    track_on: "{brand.500}"
    thumb: "{neutral.50}"

app_screen:
  archetype: "dashboard"
  frame: "browser"
  frame_params:
    url: "app.zchry.org/signal"
    title: "Signal Surface"
  content_seed: "Portfolio signal dashboard with waveform intensity, note velocity, mode toggles, and recent interactions log."
  required_tokens_checklist:
    - "background, surface1, surface2, surface3, border, border_visible"
    - "text1, text2, text3, text4"
    - "accent, accent_subtle, success, warning, error"
    - "all typography scale tokens"
    - "all spacing tokens used in components"
